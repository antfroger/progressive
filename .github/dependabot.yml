version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    versioning-strategy: "increase-if-necessary"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "[composer] "
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "[actions] "
    groups:
      all-actions:
        patterns: [ "*" ]
